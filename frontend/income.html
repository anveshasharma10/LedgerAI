<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Income Tracking — AI Expense & Budget Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/expenses.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <div class="app-container">
    <nav class="app-sidebar" id="app-sidebar"></nav>

    <div class="app-main">
      <header class="top-header" id="top-header"></header>

      <main class="page-content">

        <!-- Top Header Controls & Total -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
          <div>
            <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted); font-weight: 700;">
              Total Recorded Inflows
            </div>
            <div style="font-family: var(--font-serif); font-size: 32px; font-weight: 700; color: var(--success);" id="total-income-amount">
              ₹0.00
            </div>
          </div>

          <button class="btn btn-primary" onclick="openAddIncomeModal()">
            + Add New Income
          </button>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-bar">
          <div class="search-input-group">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-income" class="form-control" placeholder="Search by source or description..." />
          </div>

          <div class="filter-select">
            <select id="filter-source" class="form-control">
              <option value="All">All Sources</option>
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Investment">Investment</option>
              <option value="Business">Business</option>
              <option value="Gift">Gift</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <!-- Income Table Card -->
        <div class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Description</th>
                  <th>Source</th>
                  <th>Amount</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="income-tbody">
                <tr>
                  <td colspan="6" style="text-align: center; padding: 24px;">
                    <div class="spinner"></div> Loading income records...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination-wrapper" id="pagination-container"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Income Modal -->
  <div class="modal-backdrop" id="income-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="income-modal-title">Add Income Record</h3>
        <button class="modal-close-btn" onclick="UI.closeModal('income-modal')">&times;</button>
      </div>

      <form id="income-form">
        <div class="modal-body">
          <input type="hidden" id="income_id" />

          <!-- Amount -->
          <div class="form-group">
            <label class="form-label" for="amount">Amount (INR ₹) *</label>
            <input type="number" step="0.01" id="amount" class="form-control" placeholder="e.g. 50000.00" required />
          </div>

          <!-- Source -->
          <div class="form-group">
            <label class="form-label" for="source">Income Source *</label>
            <select id="source" class="form-control" required>
              <option value="Salary">Salary</option>
              <option value="Freelance">Freelance</option>
              <option value="Investment">Investment</option>
              <option value="Business">Business</option>
              <option value="Gift">Gift</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Description -->
          <div class="form-group">
            <label class="form-label" for="description">Description / Client</label>
            <input type="text" id="description" class="form-control" placeholder="e.g. Tech Corp Monthly Salary" />
          </div>

          <!-- Date -->
          <div class="form-group">
            <label class="form-label" for="income_date">Date Received *</label>
            <input type="date" id="income_date" class="form-control" required />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="UI.closeModal('income-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Record</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/income.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initIncome();
    });
  </script>
</body>
</html>
