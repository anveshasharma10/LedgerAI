<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Management — AI Expense & Budget Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/expenses.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <div class="app-container">
    <nav class="app-sidebar" id="app-sidebar"></nav>

    <div class="app-main">
      <header class="top-header" id="top-header"></header>

      <main class="page-content">

        <!-- Top Header Controls & Total -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
          <div>
            <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted); font-weight: 700;">
              Total Recorded Outflows
            </div>
            <div style="font-family: var(--font-serif); font-size: 32px; font-weight: 700; color: var(--danger);" id="total-expenses-amount">
              ₹0.00
            </div>
          </div>

          <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn btn-primary" onclick="openAddExpenseModal()">
              + Add New Expense
            </button>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="filter-bar">
          <div class="search-input-group">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-expense" class="form-control" placeholder="Search by merchant, note, or item..." />
          </div>

          <div class="filter-select">
            <select id="filter-category" class="form-control">
              <option value="All">All Categories</option>
              <option value="Food">Food</option>
              <option value="Rent">Rent</option>
              <option value="Bills">Bills</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="filter-select">
            <select id="filter-payment" class="form-control">
              <option value="All">All Payment Methods</option>
              <option value="Cash">Cash</option>
              <option value="Credit Card">Credit Card</option>
              <option value="Debit Card">Debit Card</option>
              <option value="UPI">UPI</option>
              <option value="Bank Transfer">Bank Transfer</option>
            </select>
          </div>
        </div>

        <!-- Expenses Table Card -->
        <div class="card">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Description</th>
                  <th>Category</th>
                  <th>Method</th>
                  <th>Amount</th>
                  <th>Notes</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="expenses-tbody">
                <tr>
                  <td colspan="7" style="text-align: center; padding: 24px;">
                    <div class="spinner"></div> Loading expenses...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pagination -->
          <div class="pagination-wrapper" id="pagination-container"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Add / Edit Expense Modal -->
  <div class="modal-backdrop" id="expense-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="expense-modal-title">Add New Expense</h3>
        <button class="modal-close-btn" onclick="UI.closeModal('expense-modal')">&times;</button>
      </div>

      <form id="expense-form">
        <div class="modal-body">
          <input type="hidden" id="expense_id" />

          <!-- Amount -->
          <div class="form-group">
            <label class="form-label" for="amount">Amount (INR ₹) *</label>
            <input type="number" step="0.01" id="amount" class="form-control" placeholder="e.g. 450.00" required />
          </div>

          <!-- Description -->
          <div class="form-group">
            <label class="form-label" for="description">Description / Merchant *</label>
            <input type="text" id="description" class="form-control" placeholder="e.g. Swiggy gourmet dinner" required />
          </div>

          <!-- AI Categorize Trigger Box -->
          <div class="ai-categorize-box" id="ai-categorize-box">
            <div class="ai-cat-left">
              <span class="ai-cat-icon">✨</span>
              <span class="ai-cat-text">Smart Category Prediction</span>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-ai-categorize" onclick="triggerAICategorize()">
              ✨ Categorize with AI
            </button>
          </div>

          <div id="ai-categorize-result-box" style="display: none; font-size: 12px; color: #2D5A3F; background: var(--success-bg); padding: 8px 12px; border-radius: var(--radius-sm); margin-bottom: 16px; border: 1px solid var(--success-border);">
            <span id="ai-categorize-explanation"></span>
          </div>

          <div class="form-row">
            <!-- Category -->
            <div class="form-group">
              <label class="form-label" for="category">Category *</label>
              <select id="category" class="form-control" required>
                <option value="Food">Food</option>
                <option value="Rent">Rent</option>
                <option value="Bills">Bills</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Healthcare">Healthcare</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <!-- Date -->
            <div class="form-group">
              <label class="form-label" for="expense_date">Date *</label>
              <input type="date" id="expense_date" class="form-control" required />
            </div>
          </div>

          <div class="form-row">
            <!-- Payment Method -->
            <div class="form-group">
              <label class="form-label" for="payment_method">Payment Method</label>
              <select id="payment_method" class="form-control">
                <option value="UPI">UPI</option>
                <option value="Credit Card">Credit Card</option>
                <option value="Debit Card">Debit Card</option>
                <option value="Cash">Cash</option>
                <option value="Bank Transfer">Bank Transfer</option>
              </select>
            </div>

            <!-- Notes -->
            <div class="form-group">
              <label class="form-label" for="notes">Notes / Tags</label>
              <input type="text" id="notes" class="form-control" placeholder="Optional notes" />
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="UI.closeModal('expense-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Expense</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/expenses.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initExpenses();
    });
  </script>
</body>
</html>
