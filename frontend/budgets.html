<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monthly Budgets — AI Expense & Budget Manager</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/expenses.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <div class="app-container">
    <nav class="app-sidebar" id="app-sidebar"></nav>

    <div class="app-main">
      <header class="top-header" id="top-header"></header>

      <main class="page-content">

        <!-- Top Overview & Controls -->
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 28px; flex-wrap: wrap; gap: 16px;">
          <div>
            <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted); font-weight: 700;">
              Active Period Allocation
            </div>
            <h2 style="font-family: var(--font-serif); font-size: 32px; font-weight: 700;">
              Budget Limits & Meters
            </h2>
          </div>

          <div style="display: flex; gap: 12px; align-items: center;">
            <select id="budget-month-select" class="form-control" style="width: auto;">
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>

            <select id="budget-year-select" class="form-control" style="width: auto;"></select>

            <button class="btn btn-primary btn-sm" onclick="openAddBudgetModal()">
              + New Budget
            </button>

            <button class="btn btn-ai btn-sm" onclick="openAIRecommendationsModal()">
              ✨ AI Budget Plan
            </button>
          </div>
        </div>

        <!-- Budget Stats Summary Strip -->
        <div class="metrics-grid" style="margin-bottom: 28px;">
          <div class="metric-card">
            <div class="metric-header">
              <span class="metric-title">Total Allocated</span>
              <div class="metric-icon budget">🎯</div>
            </div>
            <div class="metric-value" id="total-budget-amount">₹0.00</div>
          </div>

          <div class="metric-card">
            <div class="metric-header">
              <span class="metric-title">Total Consumed</span>
              <div class="metric-icon expense">💸</div>
            </div>
            <div class="metric-value" id="total-spent-amount" style="color: var(--danger);">₹0.00</div>
          </div>

          <div class="metric-card">
            <div class="metric-header">
              <span class="metric-title">Remaining Capacity</span>
              <div class="metric-icon income">⚖️</div>
            </div>
            <div class="metric-value" id="total-remaining-amount">₹0.00</div>
          </div>

          <div class="metric-card">
            <div class="metric-header">
              <span class="metric-title">Overall Utilization</span>
              <div class="metric-icon balance">📊</div>
            </div>
            <div class="metric-value" id="overall-usage-percentage">0%</div>
          </div>
        </div>

        <!-- Budgets Progress Cards Grid -->
        <div class="budgets-grid" id="budgets-grid-container">
          <div style="grid-column: 1/-1; text-align: center; padding: 40px;">
            <div class="spinner"></div> Calculating budgets...
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Create / Edit Budget Modal -->
  <div class="modal-backdrop" id="budget-modal">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3 class="modal-title" id="budget-modal-title">Create Category Budget</h3>
        <button class="modal-close-btn" onclick="UI.closeModal('budget-modal')">&times;</button>
      </div>

      <form id="budget-form">
        <div class="modal-body">
          <input type="hidden" id="budget_id" />

          <!-- Category -->
          <div class="form-group">
            <label class="form-label" for="budget_category">Category *</label>
            <select id="budget_category" class="form-control" required>
              <option value="Food">Food</option>
              <option value="Rent">Rent</option>
              <option value="Bills">Bills</option>
              <option value="Transport">Transport</option>
              <option value="Shopping">Shopping</option>
              <option value="Entertainment">Entertainment</option>
              <option value="Healthcare">Healthcare</option>
              <option value="Education">Education</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- Amount -->
          <div class="form-group">
            <label class="form-label" for="budget_amount">Monthly Spending Limit (INR ₹) *</label>
            <input type="number" step="0.01" id="budget_amount" class="form-control" placeholder="e.g. 10000.00" required />
          </div>

          <div class="form-row">
            <!-- Month -->
            <div class="form-group">
              <label class="form-label" for="budget_month">Month</label>
              <select id="budget_month" class="form-control" required>
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
              </select>
            </div>

            <!-- Year -->
            <div class="form-group">
              <label class="form-label" for="budget_year">Year</label>
              <input type="number" id="budget_year" class="form-control" required />
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary btn-sm" onclick="UI.closeModal('budget-modal')">Cancel</button>
          <button type="submit" class="btn btn-primary btn-sm">Save Budget</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ✨ AI Budget Recommendations Modal -->
  <div class="modal-backdrop" id="ai-recommendation-modal">
    <div class="modal-dialog" style="max-width: 650px;">
      <div class="modal-header">
        <h3 class="modal-title">✨ AI Budget Recommendations</h3>
        <button class="modal-close-btn" onclick="UI.closeModal('ai-recommendation-modal')">&times;</button>
      </div>

      <div class="modal-body" id="ai-recommendation-modal-body">
        <!-- Rendered dynamically by JS -->
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary btn-sm" onclick="UI.closeModal('ai-recommendation-modal')">Dismiss</button>
        <button type="button" class="btn btn-ai btn-sm" id="btn-apply-ai-budgets" onclick="applyAIBudgets()">
          ⚡ Apply All Recommendations
        </button>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/budgets.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.initBudgets();
    });
  </script>
</body>
</html>
