<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — LedgerAI Financial Suite</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body class="auth-body">

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo-icon" style="background: #0F172A; color: #FFFFFF; font-size: 18px; font-weight: 800; border-radius: 8px;">◆</div>
        <h2 class="auth-title">Create Account</h2>
        <p class="auth-subtitle">Initialize your personal financial ledger</p>
      </div>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label class="form-label" for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="Alex" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-email">Email Address</label>
          <input type="email" id="reg-email" class="form-control" placeholder="alex@domain.com" required />
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="reg-password" class="form-control" placeholder="Minimum 6 characters" required />
            <button type="button" class="toggle-password-btn" onclick="togglePassVisibility('reg-password')">👁️</button>
          </div>
        </div>

        <button type="submit" id="btn-register" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
          Create Account →
        </button>
      </form>

      <div class="auth-footer">
        Already registered? <a href="/login.html">Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/common.js"></script>
  <script>
    function togglePassVisibility(id) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value;
      const email = document.getElementById('reg-email').value;
      const password = document.getElementById('reg-password').value;
      const btn = document.getElementById('btn-register');

      if (password.length < 6) {
        UI.toast('Password must be at least 6 characters', 'warning');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<div class="spinner"></div> Creating Account...`;

      try {
        await Auth.register(name, email, password);
        UI.toast('Account created successfully!', 'success');
        setTimeout(() => window.location.href = '/dashboard.html', 400);
      } catch (err) {
        UI.toast(err.message || 'Registration failed', 'error');
        btn.disabled = false;
        btn.innerHTML = 'Create Account →';
      }
    });
  </script>
</body>
</html>
